name: Build & Deploy Backend API

on:
  push:
    branches:
      - main
      - dynamicwalkflow

env:
  REGISTRY: ghcr.io
  DEPLOY_PATH: /app/taxombud-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ env.REGISTRY }}/${{ github.repository }}/taxombud-api | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Downcase Image Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ env.REGISTRY }}/${{ github.repository }}/taxombud-api | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Determine Open SSH Port & Verify Secret Formats
        id: ssh-port
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_PORT }}"
          echo "Host character count: ${#HOST}"
          if [[ "$HOST" =~ [[:space:]] ]]; then
            echo "::error::VPS_HOST contains spaces or newlines!"
          fi
          if [[ "$HOST" =~ ^http ]]; then
            echo "::error::VPS_HOST contains a protocol prefix (e.g. http/https/ssh)!"
          fi

          if [ -n "$PORT" ]; then
            echo "Using specified secret VPS_PORT: $PORT"
            echo "PORT=$PORT" >> $GITHUB_OUTPUT
          elif nc -z -w 5 "$HOST" 22 2>/dev/null; then
            echo "Detected open SSH port 22"
            echo "PORT=22" >> $GITHUB_OUTPUT
          elif nc -z -w 5 "$HOST" 2222 2>/dev/null; then
            echo "Detected open SSH port 2222"
            echo "PORT=2222" >> $GITHUB_OUTPUT
          elif nc -z -w 5 "$HOST" 22022 2>/dev/null; then
            echo "Detected open SSH port 22022"
            echo "PORT=22022" >> $GITHUB_OUTPUT
          elif nc -z -w 5 "$HOST" 1022 2>/dev/null; then
            echo "Detected open SSH port 1022"
            echo "PORT=1022" >> $GITHUB_OUTPUT
          else
            echo "Defaulting SSH port to 22"
            echo "PORT=22" >> $GITHUB_OUTPUT
          fi

      - name: Deploy on VPS via SSH (Primary Attempt)
        id: ssh_deploy_1
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.PORT }}
          timeout: 120s
          command_timeout: 15m
          use_insecure_cipher: true
          script: |
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}
            
            # Create uploads and logs volumes directories if they don't exist
            mkdir -p logs uploads
            
            # Initialize .env file if it does not exist
            if [ ! -f .env ]; then
              echo "No .env file found. Creating default .env..."
              touch .env
            fi

            # Update DOCKER_IMAGE in .env to point to the latest built image
            if grep -q "DOCKER_IMAGE=" .env; then
              sed -i 's|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest|g' .env
            else
              echo "DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest" >> .env
            fi
            
            # Authenticate VPS Docker daemon with GHCR using GITHUB_TOKEN
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull latest image
            docker compose pull
            
            # Recreate containers with latest pulled images
            docker compose up -d
            
            # Clean up old dangling Docker images to save space
            docker image prune -f

      - name: Retry Deploy on VPS via SSH (Fallback Attempt)
        if: steps.ssh_deploy_1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.PORT }}
          timeout: 120s
          command_timeout: 15m
          use_insecure_cipher: true
          script: |
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}
            
            # Create uploads and logs volumes directories if they don't exist
            mkdir -p logs uploads
            
            # Initialize .env file if it does not exist
            if [ ! -f .env ]; then
              echo "No .env file found. Creating default .env..."
              touch .env
            fi

            # Update DOCKER_IMAGE in .env to point to the latest built image
            if grep -q "DOCKER_IMAGE=" .env; then
              sed -i 's|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest|g' .env
            else
              echo "DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest" >> .env
            fi
            
            # Authenticate VPS Docker daemon with GHCR using GITHUB_TOKEN
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull latest image
            docker compose pull
            
            # Recreate containers with latest pulled images
            docker compose up -d
            
            # Clean up old dangling Docker images to save space
            docker image prune -f
