name: Build & Deploy Backend API

on:
  push:
    branches:
      - main # Triggers when pushing/merging into the main branch

env:
  REGISTRY: ghcr.io
  DEPLOY_PATH: /app/taxombud-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ env.REGISTRY }}/${{ github.repository }}/taxombud-api | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Downcase Image Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ env.REGISTRY }}/${{ github.repository }}/taxombud-api | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Verify Secret Formats & Network
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          echo "Host character count: ${#HOST}"
          if [[ "$HOST" =~ [[:space:]] ]]; then
            echo "::error::VPS_HOST contains spaces or newlines!"
          fi
          if [[ "$HOST" =~ ^http ]]; then
            echo "::error::VPS_HOST contains a protocol prefix (e.g. http/https/ssh)!"
          fi
          echo "Testing TCP connection to port 2222..."
          nc -vz -w 5 "$HOST" 2222 || echo "TCP Connection failed!"

      - name: Copy Files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 2222 }}
          source: "docker-compose.yml,.env.example"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 2222 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            # Create uploads and logs volumes directories if they don't exist
            mkdir -p logs uploads
            
            # Initialize .env file if it does not exist
            if [ ! -f .env ]; then
              echo "No .env file found. Copying from .env.example..."
              cp .env.example .env
              # Replace DOCKER_IMAGE in .env with the lowercased image path
              sed -i 's|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest|g' .env
              echo "WARNING: A new .env file was created from template. Please configure it with your secrets!"
            else
              # Ensure the DOCKER_IMAGE env variable points to the correct latest image
              sed -i 's|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest|g' .env
            fi
            
            # Authenticate VPS Docker daemon with GHCR using GITHUB_TOKEN
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull latest image
            docker compose pull
            
            # Recreate containers with latest pulled images
            docker compose up -d
            
            # Clean up old dangling Docker images to save space
            docker image prune -f
