name: Build & Deploy Backend API

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/nanro-technology/taxombud-backend/taxombud-api
  DEPLOY_PATH: /app/taxombud-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine SSH Port
        id: ssh-port
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          if [ -n "$PORT" ]; then
            echo "PORT=$PORT" >> $GITHUB_OUTPUT
          else
            echo "PORT=22" >> $GITHUB_OUTPUT
          fi

      - name: Deploy on VPS via SSH (Primary Attempt)
        id: ssh_deploy_1
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.PORT }}
          timeout: 90s
          command_timeout: 15m
          script: |
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            mkdir -p logs uploads

            if [ ! -f .env ]; then
              touch .env
            fi

            if grep -q "DOCKER_IMAGE=" .env; then
              sed -i 's|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest|g' .env
            else
              echo "DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest" >> .env
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Wait before retry (avoid fail2ban)
        if: steps.ssh_deploy_1.outcome == 'failure'
        run: sleep 30

      - name: Retry Deploy on VPS via SSH (Fallback Attempt)
        if: steps.ssh_deploy_1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ steps.ssh-port.outputs.PORT }}
          timeout: 90s
          command_timeout: 15m
          script: |
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            mkdir -p logs uploads

            if [ ! -f .env ]; then
              touch .env
            fi

            if grep -q "DOCKER_IMAGE=" .env; then
              sed -i 's|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest|g' .env
            else
              echo "DOCKER_IMAGE=${{ env.IMAGE_NAME }}:latest" >> .env
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d
            docker image prune -f
