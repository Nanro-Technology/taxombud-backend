# Nginx Reverse Proxy Configuration for Hostinger VPS
# Save this file to /etc/nginx/sites-available/taxombud-api
# Create a symlink: ln -s /etc/nginx/sites-available/taxombud-api /etc/nginx/sites-enabled/
# Run 'nginx -t' to test, then 'systemctl reload nginx'

upstream taxombud_api_servers {
    server 127.0.0.1:5000; # Points to the Docker container port mapped to the host
    keepalive 32;
}

# HTTP — Redirect all traffic to HTTPS (commented out until SSL is configured)
# Once SSL is active, uncomment this block to enforce HTTPS.
# server {
#     listen 80;
#     listen [::]:80;
#     server_name _; # Or your domain name once configured
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    
    # Server name configuration
    # Change '_' to your actual domain name (e.g. api.taxombud.gov.ng) once configured
    server_name _;

    # Increase maximum upload file size for case documents
    client_max_body_size 100M;

    # Backend API Routing
    location / {
        proxy_pass http://taxombud_api_servers;
        
        # Standard HTTP headers for reverse proxying
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for long-running connections (e.g. SignalR hub and API requests)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # Disable buffering for SignalR SSE and streaming responses
        proxy_buffering off;
    }

    # SignalR WebSockets Specific Routing
    # Configured explicitly to guarantee WebSockets upgrade works
    location /hubs/ {
        proxy_pass http://taxombud_api_servers;
        
        # WebSockets upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SignalR connection timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

